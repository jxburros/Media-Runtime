name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Updated together with the companion Engine implementation; always a full commit.
  MEDIA_ENGINE_REF: c19e7cfd5158b86031c9c7b02b0b4db74636fbd3
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Media-Runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: Media-Runtime
      - uses: actions/checkout@v4
        with:
          repository: jxburros/Media-Engine
          ref: ${{ env.MEDIA_ENGINE_REF }}
          path: Media-Engine
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: Media-Runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Media-Runtime/gateway-client/package-lock.json
      - run: python -m unittest discover -s tools -p test_comfyui_import.py
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci && npm run build
        working-directory: Media-Runtime/gateway-client
      - run: python testbench/testbench.py --fixture
      - run: python -m pip install build==1.2.2.post1
      - name: Smoke-test static archive and gateway tarball
        run: bash packaging/package-runtime.sh dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-testbench
          path: Media-Runtime/testbench-runs/**/report.json
          if-no-files-found: warn
  real-backends:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: Media-Runtime
      - uses: actions/checkout@v4
        with:
          repository: jxburros/Media-Engine
          ref: ${{ env.MEDIA_ENGINE_REF }}
          path: Media-Engine
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: Media-Runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install real CPU inference engines
        working-directory: Media-Engine
        run: |
          python -m pip install uv==0.9.5
          uv export --frozen --no-dev --extra inference --extra inference-audio --extra inference-video --no-hashes --no-emit-project > "$RUNNER_TEMP/engine-constraints.txt"
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c "$RUNNER_TEMP/engine-constraints.txt" -e '.[inference,inference-audio,inference-video]'
      - run: cargo build --release --locked --manifest-path Media-Engine/native/Cargo.toml
      - name: Full integration suite plus real shared SDXL lifecycle
        working-directory: Media-Runtime
        env:
          MEDIA_ENGINE_NATIVE: ${{ github.workspace }}/Media-Engine/native/target/release/media-engine-native
        run: go test -race ./...
